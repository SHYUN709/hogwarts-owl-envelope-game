<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사회자 답안지</title>
  <style>
    :root {
      --bg: #faf6ec; --card: #ffffff; --ink: #2a1c0e; --soft: #6b5536; --line: #e4d6b8;
      --gold: #b8892f; --ok: #12693a; --team: #5a28b8; --chip: #f3ead6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Malgun Gothic", "맑은 고딕", system-ui, sans-serif; line-height: 1.45; }
    header { background: #2a1c0e; color: #f6e3a8; padding: 12px 16px; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
    .jump { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .jump a { color: #2a1c0e; background: #f6e3a8; border-radius: 8px; padding: 4px 0; width: 46px; text-align: center; text-decoration: none; font-weight: 700; font-size: 14px; }
    .jump a.team { background: #d9c4ff; }
    .jump a.sec { width: auto; padding: 4px 10px; background: transparent; color: #f6e3a8; border: 1px solid #f6e3a888; }
    main { max-width: 900px; margin: 0 auto; padding: 16px; }
    h2 { font-size: 18px; margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--gold); scroll-margin-top: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: grid; grid-template-columns: 56px 1fr; gap: 4px 12px; scroll-margin-top: 12px; }
    .no { grid-row: span 3; font-weight: 800; font-size: 20px; color: var(--gold); }
    .card.team .no { color: var(--team); }
    .q { font-weight: 700; white-space: pre-line; }
    .hint { color: var(--soft); font-size: 14px; }
    .a { color: var(--ok); font-weight: 800; font-size: 17px; }
    .a::before { content: "정답  "; font-size: 12px; color: var(--soft); font-weight: 400; }
    .meta { display: inline-block; font-size: 12px; background: var(--chip); border-radius: 6px; padding: 1px 7px; margin-left: 6px; color: var(--soft); font-weight: 400; vertical-align: middle; }
    .card.team .meta.kind { background: #ece3ff; color: var(--team); }
    .mission .no { grid-row: span 2; }
    .tip { background: #fff3cf; border: 1px solid #ecd28a; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    table.items { border-collapse: collapse; width: 100%; background: var(--card); border-radius: 12px; overflow: hidden; }
    table.items td { border-bottom: 1px solid var(--line); padding: 8px 12px; }
    .totop { position: fixed; right: 14px; bottom: 14px; background: #2a1c0e; color: #f6e3a8; border-radius: 999px; padding: 10px 16px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 12px #0004; }
    @media print {
      .totop { display: none; }
      header { position: static; background: none; color: var(--ink); padding: 0 0 8px; border-bottom: 2px solid var(--ink); }
      .jump, .noprint { display: none; }
      body { background: #fff; font-size: 12px; }
      main { padding: 0; max-width: none; }
      .card { break-inside: avoid; padding: 6px 10px; margin-bottom: 6px; }
      h2 { scroll-margin-top: 0; }
    }
  </style>
</head>
<body>
  <header id="top">
    <h1>📋 사회자 답안지 · 호그와트 부엉이 편지</h1>
    <p>게임 화면 왼쪽 위에 뜨는 번호(예: <b>Q7</b>)를 눌러 바로 찾으세요. 휴대폰으로 열어 두거나 인쇄해서 쓰면 됩니다. <span class="noprint">(Ctrl+P 인쇄)</span></p>
    <nav class="jump" id="jump"></nav>
  </header>
  <main id="main"></main>
  <a class="totop" href="#top">▲ 번호</a>

  <script src="config.js"></script>
  <script src="content.js"></script>
  <script>
    (() => {
      const C = window.GAME_CONFIG, T = window.GAME_CONTENT;
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const timeOf = (q) => { const t = q.time ?? C.quiz.timeLimit; return t > 0 ? `${t}초` : "타이머 없음"; };

      const quizzes = T.quizzes.map((q, i) => `
        <div class="card ${q.team ? "team" : ""}" id="q${i + 1}">
          <div class="no">Q${i + 1}</div>
          <div class="q">${esc(q.q).replace("{초성}", "🎰(룰렛)")}<span class="meta kind">${q.team ? "👥 함께" : "⚡ 퀴즈"}</span><span class="meta">${timeOf(q)} · ${q.points ?? C.quiz.points}점</span>${q.must ? `<span class="meta" style="background:#ffe1a8;color:#7a4a00">★ 매 판 출제</span>` : ""}</div>
          ${q.hint ? `<div class="hint">${esc(q.hint)}</div>` : "<div></div>"}
          <div class="a">${q.a ? esc(q.a) : "🎰 룰렛 문제 · 정답 없음 — 사회자 판정"}</div>
        </div>`).join("");

      const missions = T.missions.map((m, i) => `
        <div class="card mission" id="m${i + 1}">
          <div class="no">M${i + 1}</div>
          <div class="q">${esc(m.title)}<span class="meta">${(m.time ?? C.mission.timeLimit) > 0 ? (m.time ?? C.mission.timeLimit) + "초" : "타이머 없음"}</span>${m.must ? `<span class="meta" style="background:#ffe1a8;color:#7a4a00">★ 매 판 출제</span>` : ""}</div>
          <div class="hint">${esc(m.desc).replace("{초성}", "🎰(룰렛)")}<br>${esc(m.how || "")}</div>
        </div>`).join("");

      const itemQs = (T.itemQuizzes || []).map((q, i) => `
        <div class="card" id="i${i + 1}">
          <div class="no">아이템${i + 1}</div>
          <div class="q">${esc(q.q)}</div>
          ${q.hint ? `<div class="hint">${esc(q.hint)}</div>` : "<div></div>"}
          <div class="a">${esc(q.a)}</div>
        </div>`).join("");

      const ties = T.tiebreakers.map((q, i) => `
        <div class="card" id="t${i + 1}">
          <div class="no">결승${i + 1}</div>
          <div class="q">${esc(q.q)}</div><div></div>
          <div class="a">${esc(q.a)}</div>
        </div>`).join("");

      const items = ["butterbeer", "felix", "curse", "polyjuice", "timeturner", "dementor", "cloak"].map((k) => {
        const it = C.items[k];
        const eff = { butterbeer: `+${it.value}점`, felix: `+${it.value}점`, curse: `고른 팀 -${it.value}점`, polyjuice: "고른 팀과 점수 바꾸기", timeturner: "보관 → 다른 팀 문제에서 먼저 답하기", dementor: `우리 팀 -${it.value}점`, cloak: "꽝 (변화 없음)" }[k];
        return `<tr><td>${it.icon} ${esc(it.name)}</td><td><b>${eff}</b></td><td>${it.count}장</td></tr>`;
      }).join("");

      document.getElementById("main").innerHTML = `
        <div class="tip">✔ / ✘ 판정은 사회자가 버튼으로! 잘못 눌렀으면 <b>Ctrl+Z</b>. 👥 함께 퀴즈는 정답 대신 <b>성공 기준</b>이 적혀 있어요.
          스틸 팀도 같은 문제(과제)에 도전합니다.</div>
        <h2 id="quiz">📜 퀴즈 (${T.quizzes.length}문제 중 ${C.envelopeMix.quiz}장 무작위 출제)</h2>${quizzes}
        <h2 id="itemq">🎁 아이템 찬스 문제 (상식)</h2>
        <div class="tip">게임 화면 왼쪽 위에 <b>아이템 3</b>처럼 번호가 떠요. 맞힌 팀은 열기 전에 <b>직접 열기</b> 또는 <b>다른 팀에게 넘기기</b>를 골라요 (뭔지 모르는 채로!). 맞힌 팀은 <b>+10점</b>(넘겨도 맞힌 팀 것), 아이템은 받은 팀에게 그대로 적용돼요 (디멘터·꽝도 복불복). 틀리면 스틸 → 스틸도 실패하면 아이템 소멸.</div><br>${itemQs}
        <h2 id="mission">⚔️ 미션</h2>
        <div class="tip">점수: ${C.mission.rankPoints.map((p, i) => `${i + 1}등 ${p}`).join(" · ")} · 봉투 고른 팀이 1등하면 +${C.mission.pickerWinBonus}</div><br>${missions}
        <h2 id="tie">⚡ 동점 결승 문제</h2>${ties}
        <h2 id="item">🎁 아이템</h2><table class="items">${items}</table>`;

      document.getElementById("jump").innerHTML =
        T.quizzes.map((q, i) => `<a href="#q${i + 1}" class="${q.team ? "team" : ""}">Q${i + 1}</a>`).join("") +
        `<a class="sec" href="#itemq">아이템 문제</a><a class="sec" href="#mission">미션</a><a class="sec" href="#tie">결승</a><a class="sec" href="#item">아이템</a>`;
    })();
  </script>
</body>
</html>
